version: "3.5"
services:
  tt-lol-draft-sim-server:
    image: tt-lol-draft-sim-server
    ports:
      - "8003:8003"
    restart: always
    env_file: ".env"
    environment:
      # overrides any LDM_DATABASE_URL in .env so the database always lands on the volume
      LDM_DATABASE_URL: "sqlite:////data/league_draft_manager.db"
      # browsers allowed to call the API from another origin (JSON list); the deployed frontend
      LDM_CORS_ORIGINS: '["https://tt-lol-sim.intelesport.com","http://localhost:5173"]'
    # keep only the latest ~30 MB of logs (3 files x 10 MB) so they cannot fill the disk
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    volumes:
      - db_data:/data
volumes:
  db_data:
